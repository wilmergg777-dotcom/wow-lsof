name: Compilar APK AstroIO

# Cada push a Xnovaaaa que toque apk/ o launcher/ compila la APK firmada y los
# launchers de Windows/Linux, calcula sus SHA-256 y publica AstroIO.apk +
# version.json + launchers (artefacto y Release).

on:
  push:
    branches: ["Xnovaaaa"]
    paths: ["apk/**", "launcher/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Copiar imágenes del juego a los assets de la APK
        run: bash apk/copiar_assets.sh

      - name: Compilar APK (release firmada)
        run: |
          cd apk/android
          gradle assembleRelease --no-daemon

      - name: Instalar Go 1.22 (para los launchers)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compilar launchers (Windows + Linux)
        run: bash launcher/build.sh

      - name: Preparar AstroIO.apk, launchers y version.json
        run: |
          set -e
          mkdir -p out/launcher
          cp apk/android/app/build/outputs/apk/release/app-release.apk out/AstroIO.apk
          SHA=$(sha256sum out/AstroIO.apk | cut -d' ' -f1)
          CODE=$(grep -oE 'versionCode[[:space:]]+[0-9]+' apk/android/app/build.gradle | grep -oE '[0-9]+' | head -1)
          VER=$(grep -oE 'versionName[[:space:]]+"[^"]+"' apk/android/app/build.gradle | sed 's/.*"\(.*\)"/\1/')
          cp launcher/AstroIO-Launcher-windows.exe launcher/AstroIO-Launcher-linux launcher/AstroIO-Setup-Windows.exe out/launcher/
          SHA_W=$(sha256sum out/launcher/AstroIO-Launcher-windows.exe | cut -d' ' -f1)
          SHA_L=$(sha256sum out/launcher/AstroIO-Launcher-linux | cut -d' ' -f1)
          SHA_S=$(sha256sum out/launcher/AstroIO-Setup-Windows.exe | cut -d' ' -f1)
          LCODE=$(grep -oE 'launcherVersionCode = [0-9]+' launcher/main.go | grep -oE '[0-9]+' | head -1)
          LVER=$(grep -oE 'launcherVersionName = "[^"]+"' launcher/main.go | sed 's/.*"\(.*\)"/\1/')
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          cat > out/version.json <<JSON
          {
            "versionCode": ${CODE},
            "versionName": "${VER}",
            "url": "https://astroio.duckdns.org/apk/AstroIO.apk",
            "sha256": "${SHA}",
            "launcher": {
              "versionCode": ${LCODE},
              "versionName": "${LVER}",
              "windows": {
                "url": "https://astroio.duckdns.org/launcher/AstroIO-Launcher-windows.exe",
                "sha256": "${SHA_W}"
              },
              "linux": {
                "url": "https://astroio.duckdns.org/launcher/AstroIO-Launcher-linux",
                "sha256": "${SHA_L}"
              },
              "windowsInstaller": {
                "url": "https://astroio.duckdns.org/launcher/AstroIO-Setup-Windows.exe",
                "sha256": "${SHA_S}"
              }
            }
          }
          JSON
          echo "── version.json generado ──"
          cat out/version.json

      - name: Guardar artefactos (APK + launchers + version.json)
        uses: actions/upload-artifact@v4
        with:
          name: astroio-apk-v${{ env.CODE }}-${{ env.VER }}
          path: |
            out/AstroIO.apk
            out/version.json
            out/launcher/

      - name: Publicar Release apk-v${{ env.CODE }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.CODE }}
          name: AstroIO APK v${{ env.VER }} (build ${{ env.CODE }})
          body: |
            APK firmada de AstroIO v${{ env.VER }} (versionCode ${{ env.CODE }}) + launcher Windows/Linux + Setup Windows (Go, sin error SxS).

            Para actualizar tu servidor:
            1) Descarga AstroIO.apk, version.json y la carpeta launcher/ de este Release.
            2) Sube AstroIO.apk y version.json por FTP a /apk/
            3) Sube los launchers y AstroIO-Setup-Windows.exe por FTP a /launcher/
            (instrucciones completas en apk/server/LEEME-SERVIDOR.txt)
          files: |
            out/AstroIO.apk
            out/version.json
            out/launcher/AstroIO-Launcher-windows.exe
            out/launcher/AstroIO-Launcher-linux
            out/launcher/AstroIO-Setup-Windows.exe
